[mypy]
python_version = 3.11
plugins = pydantic.mypy
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
files = app

# Sane defaults for a FastAPI/SQLAlchemy codebase without full type coverage:
# strict on our own code where it's tractable, lenient where third-party stubs
# would otherwise generate noise.
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

# SQLAlchemy ORM models use mapped_column descriptors that mypy can't always
# resolve without a dedicated plugin; relax there.
[mypy-app.models.*]
disable_error_code = assignment, var-annotated

# Alembic migration files are auto-generated and not interesting to type-check.
[mypy-alembic.*]
ignore_errors = True

# Seed script: one-shot, mixes Enum and str values in untyped dict literals.
[mypy-app.seed]
ignore_errors = True
